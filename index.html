<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物演化 3D 可视化</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css?v=20261019L">
</head>
<body>
    <!-- 顶部标题栏 -->
    <header id="header">
        <h1>生物演化 3D 可视化</h1>
        <p class="subtitle">从 4200 Ma 至今的生命演化历程</p>
    </header>

    <!-- 3D 场景容器 -->
    <div id="scene3d"></div>
    <div id="labels"></div>

    <!-- 左侧控制面板 -->
    <aside id="panel-left" class="panel">
        <h2>控制面板</h2>

        <!-- 搜索 -->
        <section class="panel-section">
            <label for="search-input">搜索节点</label>
            <input type="text" id="search-input" placeholder="输入中文名或拉丁学名">
            <div id="search-results"></div>
        </section>

        <!-- 时间控制 -->
        <section class="panel-section">
            <label for="time-slider">时间游标 <span id="time-display">0 Ma</span></label>
            <input type="range" id="time-slider" min="0" max="4200" value="0" step="1">
            <div class="time-controls">
                <div class="control-row-main">
                    <button id="play-btn" class="btn-primary">▶ 播放</button>
                    <button id="reset-time-btn" class="btn-secondary">重置</button>
                    <button id="tour-btn" class="btn-primary">▶ 漫游</button>
                </div>
                <div class="control-row-speed">
                    <span class="speed-label">速度</span>
                    <div class="speed-segment">
                        <button id="speed-1x" class="speed-btn active">1×</button>
                        <button id="speed-4x" class="speed-btn">4×</button>
                        <button id="speed-16x" class="speed-btn">16×</button>
                    </div>
                </div>
                <div class="control-row-follow">
                    <label class="follow-label">
                        <input type="checkbox" id="time-follow-checkbox" checked>
                        <span>跟随播放</span>
                    </label>
                    <label class="follow-label">
                        <input type="checkbox" id="tour-roll-checkbox">
                        <span>漫游旋转</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 时间轴模式 -->
        <section class="panel-section">
            <label>
                <input type="checkbox" id="time-mode-toggle">
                时间轴等距模式
            </label>
        </section>

        <!-- 预设视角 -->
        <section class="panel-section">
            <label>预设视角</label>
            <div class="button-group">
                <button class="view-btn" data-view="top">俯视</button>
                <button class="view-btn" data-view="side">侧视</button>
                <button class="view-btn" data-view="overview">全景</button>
            </div>
        </section>

        <!-- 自动旋转 -->
        <section class="panel-section">
            <label>
                <input type="checkbox" id="auto-rotate-toggle">
                自动旋转
            </label>
        </section>

        <!-- 名称数量滑块 -->
        <section class="panel-section">
            <label for="label-budget-slider">同屏名称：<span id="label-budget-display">15</span></label>
            <input type="range" id="label-budget-slider" min="0" max="45" value="15" step="1">
        </section>
    </aside>

    <!-- 右侧信息面板 -->
    <aside id="panel-right" class="panel">
        <h2>节点详情</h2>
        <div id="node-info" class="node-info-content">
            <p class="placeholder">点击节点查看详情</p>
        </div>
    </aside>

    <!-- 底部图例 -->
    <footer id="legend">
        <div class="legend-section" id="clade-legend-section">
            <h3>大类颜色</h3>
            <div id="clade-legend" class="legend-items"></div>
        </div>
        <div class="legend-section">
            <h3>边类型</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="edge-sample phylo"></span>
                    <span>谱系继承（实线箭头）</span>
                </div>
                <div class="legend-item">
                    <span class="edge-sample endosymbiosis"></span>
                    <span>内共生</span>
                </div>
                <div class="legend-item">
                    <span class="edge-sample hgt"></span>
                    <span>水平基因转移</span>
                </div>
                <div class="legend-item">
                    <span class="edge-sample introgression"></span>
                    <span>杂交渗入</span>
                </div>
                <div class="legend-item">
                    <span class="edge-sample ring"></span>
                    <span>环物种</span>
                </div>
                <div class="legend-item">
                    <span class="edge-sample symbiosis"></span>
                    <span>共生</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- 右下角状态条 -->
    <div id="status-bar">
        <span id="stats">节点: <strong>0</strong> | 边: <strong>0</strong></span>
    </div>

    <!-- 依赖库 -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="vendor/CSS2DRenderer.js"></script>

    <!-- 数据文件 -->

    <!-- 布局模块 -->
    <script src="js/data7.js?v=20261019L"></script>
  <script src="js/layout.js?v=20261019L"></script>

    <!-- 应用逻辑 -->
    <script src="js/app.js?v=20261019L"></script>
    <script src="js/ui.js?v=20261019L"></script>
</body>
</html>
